    <div id="rsvpPasesBox">

    </div>
    <textarea class="rsvp-field" id="rsvpMsg" placeholder="Déjales un lindo mensaje a Yenisei Dayami..."></textarea>

    <button type="submit" class="rsvp-btn">Confirmar asistencia</button>
  </form>

<script>
(function(){
  var TELEFONO = "XXXXXXXXXXXXX";   // WhatsApp de los novios
  var MAX_PALABRAS = 40;
  var asiste = "si";

  var $ = function(id){ return document.getElementById(id); };

  // Botones Sí / No
  document.querySelectorAll('.rsvp-choice').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.rsvp-choice').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      asiste = btn.dataset.val;
      $('rsvpPasesBox').classList.toggle('rsvp-hide', asiste === 'no');
    });
  });

  // Contador de palabras (máx. 40)
  $('rsvpMsg').addEventListener('input', function(){
    var palabras = this.value.trim().split(/\s+/).filter(Boolean);
    if (palabras.length > MAX_PALABRAS) {
      this.value = palabras.slice(0, MAX_PALABRAS).join(' ');
      palabras = palabras.slice(0, MAX_PALABRAS);
    }
    $('rsvpCnt').textContent = palabras.length;
  });

  // Enviar por WhatsApp
  $('rsvpForm').addEventListener('submit', function(e){
    e.preventDefault();
    var nombre = $('rsvpNombre').value.trim();
    if (!nombre) {
      Swal.fire({icon:'warning', title:'Falta tu nombre', text:'Escribe tu nombre o el de tu familia.', confirmButtonColor:'#b8963e'});
      return;
    }
    var msg = $('rsvpMsg').value.trim();

    var texto = "Hola, soy *" + nombre + "*.\n";
    texto += asiste === 'si'
      ? "✨ Confirmo mi asistencia a la boda de Yenisei Dayami.\nPases: " + $('rsvpPases').value
      : "💔 Lamentablemente no podré asistir a la boda de Yenisei Dayami.";
    if (msg) texto += "\nMensaje: " + msg;

    window.open("https://api.whatsapp.com/send?phone=" + TELEFONO + "&text=" + encodeURIComponent(texto), "_blank");
  });
})();
</script>

new WOW().init();


document.addEventListener("DOMContentLoaded", () => {
  const elementos = document.querySelectorAll(".observado");
  const animando = new Set();
  const yaAnimado = new WeakMap();
  const timeoutLimpieza = new WeakMap();

  elementos.forEach(el => {
    const anims = [...el.classList].filter(c =>
      c.startsWith("animate__") && c !== "animate__animated"
    );
    el.dataset.animations = anims.join(" ");
    el.classList.remove("animate__animated", ...anims);
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const el = entry.target;
      const anims = el.dataset.animations.split(" ").filter(Boolean);
      const tieneControl = el.dataset.control === 'true';

      if (entry.isIntersecting) {
        if (animando.has(el) || yaAnimado.get(el) === 'animando') return;

        if (timeoutLimpieza.has(el)) {
          clearTimeout(timeoutLimpieza.get(el));
          timeoutLimpieza.delete(el);
        }

        animando.add(el);
        yaAnimado.set(el, 'animando');
        
        if (tieneControl) {
          el.style.opacity = '1';
          el.style.transform = 'none';
        }
        
        el.classList.add("animate__animated", ...anims);
        
        const limpiar = () => {
          if (timeoutLimpieza.has(el)) {
            clearTimeout(timeoutLimpieza.get(el));
            timeoutLimpieza.delete(el);
          }
          
          animando.delete(el);
          yaAnimado.set(el, false); // 🔥 false en vez de dejar 'animando'
          el.classList.remove("animate__animated", ...anims);
          
          if (tieneControl) {
            el.style.opacity = '0';
          } else {
            el.style.transform = 'none';
            el.style.opacity = '1';
          }
        };
        
        const timeout = setTimeout(() => limpiar(), 2500);
        timeoutLimpieza.set(el, timeout);
        
        el.addEventListener("animationend", () => limpiar(), { once: true });

      } else {
        if (animando.has(el)) return;
        
        yaAnimado.set(el, false);
        el.classList.remove("animate__animated", ...anims);
        
        if (tieneControl) {
          el.style.transform = 'none';
          el.style.opacity = '0';
        } else {
          el.style.transform = 'none';
          el.style.opacity = '1';
        }
      }
    });
  }, {
    threshold: 0.05,
    rootMargin: "50px"
  });

  elementos.forEach(el => observer.observe(el));
});
